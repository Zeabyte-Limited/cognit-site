# Deploys the Cognit marketing site (Cloudflare Worker) on every push to main.
#
# Needs ONE repo secret: CLOUDFLARE_API_TOKEN — a Cloudflare API token with
# "Workers Scripts: Edit" on the Zeabyte account (dash.cloudflare.com →
# My Profile → API Tokens → Create Token → "Edit Cloudflare Workers" template).
# Without the secret this workflow fails at the deploy step — nothing breaks.
#
# Why CI and not local wrangler: the owner's dev machine is Windows ARM64,
# which wrangler's workerd dependency does not support at all.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
